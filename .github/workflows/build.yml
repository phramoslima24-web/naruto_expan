name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Verifica o JAR do Narutoto
        run: test -f libs/narutoto-0.4.1.jar || (echo "Falta libs/narutoto-0.4.1.jar" && exit 1)
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: narutoto-expansion
          path: build/libs/*.jar
